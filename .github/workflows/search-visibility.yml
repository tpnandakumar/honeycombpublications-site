name: RBSP - Rocket Booster Sprint Protocol

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blocker-immunisation:
    name: RBSP Blocker Immunisation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate crawl and indexing readiness
        run: python scripts/search_visibility.py audit

  rocket-booster-submit:
    name: RBSP Discovery Boost
    if: github.event_name == 'push'
    needs: blocker-immunisation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Sprint changed public URLs to IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python scripts/search_visibility.py submit
